defaultNamespace: rst-workbench

helm:
  releaseName: rst-workbench
  # Chart lives in this same directory — fleet.yaml acts as the bundle root,
  # so Fleet only packages helm/rst-workbench/** (templates + values), not the
  # rest of the SuperDARN tree. This keeps the bundle well under Rancher's
  # 3 MB API request limit. Belt-and-braces .fleetignore entries below add a
  # second layer of exclusion in case the file ever moves up the tree.
  chart: .

  # Ingress host is resolved by the chart's _helpers.tpl, which per the
  # ClusterOS helm-ingress guide reads kube-system/clusteros-config (the
  # source of truth that the node-agent always publishes), then falls back
  # to a <node-ip>.nip.io address.
  #
  # NOTE: Fleet's optional `valuesFrom: clusteros-helm-values` path is NOT
  # used here. That ConfigMap is published by newer ClusterOS node-agents
  # in fleet-local / fleet-default, but Fleet's configMapKeyRef has no
  # `optional:` flag — if the CM is absent the whole bundle fails with
  # `ErrApplied ... configmaps "clusteros-helm-values" not found`.
  # If your cluster publishes it and you want cluster-side annotation
  # overrides flowing in, re-enable by uncommenting:
  #
  # valuesFrom:
  #   - configMapKeyRef:
  #       name: clusteros-helm-values
  #       namespace: fleet-local        # or fleet-default for remote targets
  #       key: values.yaml

# Ingress host resolution order (see _helpers.tpl :: rst-workbench.ingressHost):
#   1. .Values.ingress.hosts[0].host        (explicit override; none by default)
#   2. .Values.global.clusterDomain         (set only if valuesFrom is re-enabled)
#   3. lookup() against kube-system/clusteros-config key "domain"   <- ACTIVE PATH
#   4. <node-internal-ip>.nip.io            (LAN fallback)
#
# Override the subdomain or images per environment with targetCustomizations:
#
# targetCustomizations:
#   - name: production
#     clusterSelector:
#       matchLabels:
#         env: production
#     helm:
#       values:
#         backend:
#           cuda:
#             enabled: true
#
#   - name: dev
#     clusterSelector:
#       matchLabels:
#         env: dev
#     helm:
#       values:
#         ingressSubdomain: rst-dev

# Bundle exclusion lives in `.fleetignore` (this directory) and the
# repo-root `.fleetignore` — Fleet honours those for what NOT to package.
# `ignore.conditions:` is a different field (rate-limits re-reconciles for
# changes inside a watched path) and only accepts paths within the bundle
# root, so the previous `../../external` / `../../src` / ... entries here
# were silently ignored. They've been removed.
#
# If the GitRepo CR in Rancher is still hitting the 3 MiB API limit when
# Fleet posts the Bundle CR, the GitRepo's `spec.paths:` should be pinned
# to `["helm/rst-workbench"]` (or the equivalent `bundleDirs`). Otherwise
# Fleet's git clone runs with `--recurse-submodules` and pulls in the
# 57 MB external/rst tree before the .fleetignore filter is applied.
